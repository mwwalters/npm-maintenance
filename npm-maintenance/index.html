<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Down for Maintenance</title>
  <style>
    body {
      font-family: sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      background: #f4f4f4;
    }
    .box {
      text-align: center;
      background: white;
      padding: 2rem 3rem;
      border-radius: 8px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.1);
    }
    h1 { color: #e74c3c; }
    p { color: #555; }
    a { color: #3498db; }
  </style>
</head>
<body>
  <div class="box">
    <h1>Down for Maintenance</h1>
    <p>This resource is currently unavailable while we perform scheduled maintenance.</p>
    <p>Please contact the administrator with any questions.</p>
  </div>
</body>
</html>
